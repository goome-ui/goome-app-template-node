name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "22"
          - os: ubuntu-latest
            node: "18"
          - os: windows-latest
            node: "22"
          - os: macos-latest
            node: "22"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      GOOME_BACKEND: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: install
        run: npm install --no-audit --no-fund
      - name: run on the test backend
        run: |
          mkdir -p shots
          out=$(GOOME_TEST_SHOTS=shots GOOME_TEST_SCRIPT="screen 1280x720 1; 3 click 60,28; end 6" node main.js)
          echo "$out"
          ls shots | grep -q ppm
          if [ -d variants ]; then echo "$out" | grep -q "overlay mode"; fi
      - name: other templates
        if: hashFiles('variants/**') != ''
        run: |
          for v in variants/*/; do
            n=$(basename "$v")
            mkdir -p "shots-$n"
            GOOME_TEST_SHOTS="shots-$n" GOOME_TEST_SCRIPT="screen 1280x720 1; 2 hotkey alt+m; 3 click 100,140; end 6" node "$v/main.js"
            ls "shots-$n" | grep -q ppm
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-${{ matrix.os }}-${{ matrix.node }}
          path: shots*/
          if-no-files-found: ignore
